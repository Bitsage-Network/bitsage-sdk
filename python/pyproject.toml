[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obelyzk"
version = "0.3.0"
description = "ObelyZK / BitSage SDK — verifiable serverless compute on Starknet with recursive STARK proofs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "ObelyZK", email = "dev@obelysk.xyz" }
]
keywords = ["obelyzk", "zkml", "starknet", "zero-knowledge", "machine-learning", "stark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "starknet-py>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
bitsage = "bitsage.cli:main"

[project.urls]
Homepage = "https://obelysk.xyz"
Documentation = "https://github.com/Bitsage-Network/stwo-ml"
Repository = "https://github.com/Bitsage-Network/stwo-ml"

[tool.hatch.build.targets.wheel]
packages = ["obelyzk", "bitsage"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true
