[package]
name = "bitsage-wasm-crypto"
version = "0.1.0"
edition = "2021"
authors = ["BitSage Team"]
description = "WASM cryptographic primitives for BitSage privacy operations"
license = "Apache-2.0"
repository = "https://github.com/bitsage-network/bitsage-sdk"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

# Crypto primitives
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"

# Big integers and field arithmetic
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
num-integer = "0.1"

# Random number generation (WASM compatible)
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"
rand_core = "0.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

# Error handling
thiserror = "1.0"

# Lazy initialization
lazy_static = "1.4"

# Optional panic hook for better error messages
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
# Optimize for size in WASM
opt-level = "s"
lto = true
